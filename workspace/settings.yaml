# Налаштування робочого каталогу. Читають агенти (AGENTS.md, скіли kanban-*).
# Новий проект додавати скілом kanban-project: він же оновить .claude/settings.json, дошку і vault.

agent:
  language: українська          # мова відповідей і документації
  ai_todo: 2_ai                 # колонка «передано агенту» (dir етапу); порожньо — агент етапи не чіпає
  ai_done: 3_ai_done            # куди агент переносить виконану задачу
  effort: true                  # записувати «Трудомісткість» перед перенесенням в ai_done

